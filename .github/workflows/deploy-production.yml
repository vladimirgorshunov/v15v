name: Deploy Production

on:
  pull_request:
    branches:
      - master
    types:
      - closed
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag, or branch to deploy (optional)
        required: false
        type: string
        default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify merged commit
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
      }}
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_SANITY_PROJECT_ID: ${{ vars.VITE_SANITY_PROJECT_ID }}
      VITE_SANITY_DATASET: ${{ vars.VITE_SANITY_DATASET }}
      VITE_SANITY_API_VERSION: ${{ vars.VITE_SANITY_API_VERSION }}
      VITE_SANITY_USE_CDN: ${{ vars.VITE_SANITY_USE_CDN }}
    steps:
      - name: Resolve deployment ref
        id: resolve_ref
        env:
          MANUAL_REF: ${{ github.event.inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          if [ -n "$MANUAL_REF" ]; then
            echo "value=$MANUAL_REF" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ -n "$MERGE_SHA" ]; then
            echo "value=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "value=$FALLBACK_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_ref.outputs.value }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Validate Sanity build configuration
        run: |
          test -n "$VITE_SANITY_PROJECT_ID" || (echo "Missing variable: VITE_SANITY_PROJECT_ID" && exit 1)
          test -n "$VITE_SANITY_DATASET" || (echo "Missing variable: VITE_SANITY_DATASET" && exit 1)

      - name: Build
        run: bun run build

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-public
          path: .output/public
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to production
    needs:
      - verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate deployment configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CF_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "$AWS_ROLE_ARN" || (echo "Missing secret: AWS_ROLE_ARN" && exit 1)
          test -n "$AWS_REGION" || (echo "Missing variable: AWS_REGION" && exit 1)
          test -n "$S3_BUCKET" || (echo "Missing variable: S3_BUCKET" && exit 1)
          test -n "$CF_DISTRIBUTION_ID" || (echo "Missing variable: CLOUDFRONT_DISTRIBUTION_ID" && exit 1)

      - name: Download static artifact
        uses: actions/download-artifact@v4
        with:
          name: site-public
          path: site-public

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync files to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: aws s3 sync site-public/ "s3://$S3_BUCKET" --delete

      - name: Invalidate CloudFront cache
        env:
          CF_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --id "$invalidation_id"
