name: Deploy Production

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag, or branch on master history (empty uses master)
        required: false
        type: string
        default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify deployment commit
    runs-on: ubuntu-26.04
    environment: production
    env:
      VITE_SANITY_PROJECT_ID: ${{ vars.VITE_SANITY_PROJECT_ID }}
      VITE_SANITY_DATASET: ${{ vars.VITE_SANITY_DATASET }}
      VITE_SANITY_API_VERSION: ${{ vars.VITE_SANITY_API_VERSION }}
      VITE_SANITY_USE_CDN: ${{ vars.VITE_SANITY_USE_CDN }}
    steps:
      - name: Require the protected workflow branch
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          test "$WORKFLOW_REF" = refs/heads/master || {
            echo "Production deployments must run the workflow from master"
            exit 1
          }

      - name: Checkout master history
        uses: actions/checkout@v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and checkout deployment commit
        env:
          MANUAL_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          requested_ref="${MANUAL_REF:-refs/remotes/origin/master}"
          commit="$(git rev-parse --verify --end-of-options "${requested_ref}^{commit}" 2>/dev/null ||
            git rev-parse --verify --end-of-options "refs/remotes/origin/${requested_ref}^{commit}")"
          git merge-base --is-ancestor "$commit" refs/remotes/origin/master || {
            echo "Deployment ref must resolve to a commit on master history"
            exit 1
          }
          git checkout --detach "$commit"
          echo "Deploying master-history commit: $commit"

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Validate Sanity build configuration
        run: |
          test -n "$VITE_SANITY_PROJECT_ID" || (echo "Missing variable: VITE_SANITY_PROJECT_ID" && exit 1)
          test -n "$VITE_SANITY_DATASET" || (echo "Missing variable: VITE_SANITY_DATASET" && exit 1)

      - name: Build
        run: bun run build

      - name: Validate static build output
        run: |
          test -s .output/public/index.html
          test -s .output/public/_shell.html
          test -s .output/public/404/index.html
          test -d .output/public/assets

      - name: Upload static artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-public
          path: .output/public
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to production
    needs:
      - verify
    runs-on: ubuntu-26.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate deployment configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CF_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "$AWS_ROLE_ARN" || (echo "Missing secret: AWS_ROLE_ARN" && exit 1)
          test -n "$AWS_REGION" || (echo "Missing variable: AWS_REGION" && exit 1)
          test -n "$S3_BUCKET" || (echo "Missing variable: S3_BUCKET" && exit 1)
          test -n "$CF_DISTRIBUTION_ID" || (echo "Missing variable: CLOUDFRONT_DISTRIBUTION_ID" && exit 1)

      - name: Download static artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: site-public
          path: site-public

      - name: Require complete downloaded entries
        run: |
          test -s site-public/index.html
          test -s site-public/_shell.html
          test -s site-public/404/index.html
          test -d site-public/assets

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish versioned assets first
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 cp site-public/assets/ "s3://$S3_BUCKET/assets/" \
            --recursive --cache-control 'public,max-age=31536000,immutable'

      - name: Publish other static resources
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 cp site-public/ "s3://$S3_BUCKET/" --recursive \
            --exclude 'assets/*' --exclude '*.html' \
            --cache-control 'public,max-age=0,must-revalidate'

      - name: Publish HTML entries last
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 cp site-public/ "s3://$S3_BUCKET/" --recursive \
            --exclude '*' --include '*.html' --cache-control 'no-cache'

      - name: Invalidate CloudFront cache
        env:
          CF_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --id "$invalidation_id"
