name: Deploy Production

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag, or branch on master history (empty uses master)
        required: false
        type: string
        default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify deployment commit
    runs-on: ubuntu-26.04
    environment: production
    env:
      VITE_SANITY_PROJECT_ID: ${{ vars.VITE_SANITY_PROJECT_ID }}
      VITE_SANITY_DATASET: ${{ vars.VITE_SANITY_DATASET }}
      VITE_SANITY_API_VERSION: ${{ vars.VITE_SANITY_API_VERSION }}
      VITE_SANITY_USE_CDN: ${{ vars.VITE_SANITY_USE_CDN }}
    steps:
      - name: Require the protected workflow branch
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          test "$WORKFLOW_REF" = refs/heads/master || {
            echo "Production deployments must run the workflow from master"
            exit 1
          }

      - name: Checkout master history
        uses: actions/checkout@v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and checkout deployment commit
        env:
          MANUAL_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          requested_ref="${MANUAL_REF:-refs/remotes/origin/master}"
          commit="$(git rev-parse --verify --end-of-options "${requested_ref}^{commit}" 2>/dev/null ||
            git rev-parse --verify --end-of-options "refs/remotes/origin/${requested_ref}^{commit}")"
          git merge-base --is-ancestor "$commit" refs/remotes/origin/master || {
            echo "Deployment ref must resolve to a commit on master history"
            exit 1
          }
          git checkout --detach "$commit"
          echo "Deploying master-history commit: $commit"

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Validate Sanity build configuration
        run: |
          test -n "$VITE_SANITY_PROJECT_ID" || (echo "Missing variable: VITE_SANITY_PROJECT_ID" && exit 1)
          test -n "$VITE_SANITY_DATASET" || (echo "Missing variable: VITE_SANITY_DATASET" && exit 1)

      - name: Build
        run: bun run build

      - name: Validate SSR build output
        run: |
          test -s .output/server/index.mjs
          test -d .output/public/assets
          node --input-type=module -e "import { invokeLambdaHandler } from 'srvx/aws-lambda'; const { handler } = await import('./.output/server/index.mjs'); const r = await invokeLambdaHandler(handler, new Request('https://v15v.com/')); const t = await r.text(); if (r.status !== 200 || !t.includes('I am a web-developer with')) { console.error('SSR smoke failed', r.status); process.exit(1) }"

      - name: Package Lambda
        run: |
          (cd .output/server && zip -qr "$GITHUB_WORKSPACE/site-server.zip" .)
          test "$(stat -c%s site-server.zip)" -lt 50000000

      - name: Upload static artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-public
          path: .output/public
          if-no-files-found: error
          retention-days: 7

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-server
          path: site-server.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to production
    needs:
      - verify
    runs-on: ubuntu-26.04
    environment: production
    env:
      LAMBDA_ALIAS: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate deployment configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CF_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          test -n "$AWS_ROLE_ARN" || (echo "Missing secret: AWS_ROLE_ARN" && exit 1)
          test -n "$AWS_REGION" || (echo "Missing variable: AWS_REGION" && exit 1)
          test -n "$S3_BUCKET" || (echo "Missing variable: S3_BUCKET" && exit 1)
          test -n "$CF_DISTRIBUTION_ID" || (echo "Missing variable: CLOUDFRONT_DISTRIBUTION_ID" && exit 1)
          test -n "$LAMBDA_FUNCTION_NAME" || (echo "Missing variable: LAMBDA_FUNCTION_NAME" && exit 1)

      - name: Download static artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: site-public
          path: site-public

      - name: Download Lambda artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: site-server
          path: .

      - name: Require complete downloaded entries
        run: |
          test -d site-public/assets
          test -s site-server.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish versioned assets first
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 cp site-public/assets/ "s3://$S3_BUCKET/assets/" \
            --recursive --cache-control 'public,max-age=31536000,immutable'

      - name: Publish other static resources
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 cp site-public/ "s3://$S3_BUCKET/" --recursive \
            --exclude 'assets/*' \
            --cache-control 'public,max-age=0,must-revalidate'

      - name: Publish Lambda version
        id: publish
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          version="$(aws lambda update-function-code --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://site-server.zip --publish --query Version --output text)"
          aws lambda wait published-version-active --function-name "$LAMBDA_FUNCTION_NAME" --qualifier "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the new version
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail
          for path in / /blog; do
            cat > smoke-event.json <<EOF
          {"version":"2.0","routeKey":"\$default","rawPath":"$path","rawQueryString":"","headers":{"host":"v15v.com","accept":"text/html","x-forwarded-proto":"https"},"requestContext":{"http":{"method":"GET","path":"$path","protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"deploy-smoke"}},"isBase64Encoded":false}
          EOF
            aws lambda invoke --function-name "$LAMBDA_FUNCTION_NAME" --qualifier "$VERSION" \
              --cli-binary-format raw-in-base64-out --payload fileb://smoke-event.json \
              smoke-response.json > invoke-meta.json
            jq -e '.FunctionError == null' invoke-meta.json
            jq -e '.statusCode == 200' smoke-response.json
            body="$(jq -r 'if .isBase64Encoded then (.body|@base64d) else .body end' smoke-response.json)"
            if [ "$path" = / ]; then
              grep -q 'I am a web-developer with' <<< "$body"
            else
              grep -q '<h1' <<< "$body"
            fi
          done

      - name: Switch production alias
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          previous="$(aws lambda get-alias --function-name "$LAMBDA_FUNCTION_NAME" --name "$LAMBDA_ALIAS" --query FunctionVersion --output text)"
          aws lambda update-alias --function-name "$LAMBDA_FUNCTION_NAME" --name "$LAMBDA_ALIAS" --function-version "$VERSION"
          echo "Lambda $LAMBDA_ALIAS: $previous -> $VERSION (rollback: aws lambda update-alias --function-name $LAMBDA_FUNCTION_NAME --name $LAMBDA_ALIAS --function-version $previous)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Invalidate CloudFront cache
        env:
          CF_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --id "$invalidation_id"
